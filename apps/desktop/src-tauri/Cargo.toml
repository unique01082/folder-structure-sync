[package]
name = "rootline-desktop"
version = "2.0.0"
description = "Rootline by baole.space desktop native boundary"
authors = ["baole.space"]
edition = "2021"
license = "ISC"

[lib]
name = "rootline_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "rootline-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rfd = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
