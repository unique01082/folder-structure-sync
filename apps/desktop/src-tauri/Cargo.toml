[package]
name = "rootline-desktop"
version = "2.0.0"
description = "Rootline by baole.space desktop native boundary"
authors = ["baole.space"]
edition = "2021"
license = "ISC"

[lib]
name = "rootline_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "rootline-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = "4.1"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2.4"
tauri-plugin-opener = "2.5"
tauri-plugin-single-instance = { version = "2.4", features = ["deep-link"] }
tauri-plugin-stronghold = "2.3"
tauri-plugin-updater = "2.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["sync"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }
