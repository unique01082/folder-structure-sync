services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rootline
      POSTGRES_PASSWORD: rootline
      POSTGRES_DB: rootline_test
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rootline -d rootline_test"]
      interval: 1s
      timeout: 3s
      retries: 30
