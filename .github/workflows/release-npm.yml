name: Release npm 2.0.0

"on":
  push:
    tags: ["v2.0.0"]
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type release-v2.0.0 to publish the stable package
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-npm-2.0.0
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    environment: npm-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require exact stable ref, version, and npm credential
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -eu
          if [ "${GITHUB_REF}" != "refs/tags/v2.0.0" ]; then
            echo "::error::Stable npm release is restricted to refs/tags/v2.0.0."
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${CONFIRMATION}" != "release-v2.0.0" ]; then
            echo "::error::Stable npm release blocked. Re-run with confirmation=release-v2.0.0."
            exit 1
          fi
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::error::Stable npm release blocked. Configure NPM_TOKEN as a protected npm-production environment secret with publish access to folder-structure-sync."
            exit 1
          fi
          node -e "const p=require('./packages/cli/package.json'); if(p.version !== '2.0.0') throw new Error('packages/cli/package.json must be version 2.0.0')"

  pack:
    needs: preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      checksum: ${{ steps.checksum.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test:unit
      - run: pnpm --filter folder-structure-sync test:pack
      - run: mkdir release && pnpm --filter folder-structure-sync pack --pack-destination release
      - id: checksum
        name: Record the exact publish tarball checksum
        run: |
          checksum=$(sha256sum release/folder-structure-sync-2.0.0.tgz | cut -d ' ' -f 1)
          echo "${checksum}  folder-structure-sync-2.0.0.tgz" > release/SHA256SUMS
          echo "sha256=${checksum}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rootline-npm-2.0.0
          path: release
          if-no-files-found: error

  publish:
    needs: [preflight, pack]
    runs-on: ubuntu-24.04
    environment: npm-production
    permissions:
      contents: none
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rootline-npm-2.0.0
          path: release
      - name: Verify unprivileged pack output
        env:
          EXPECTED_SHA256: ${{ needs.pack.outputs.checksum }}
        run: |
          set -eu
          printf '%s  %s\n' "$EXPECTED_SHA256" release/folder-structure-sync-2.0.0.tgz | sha256sum --check --strict
          node -e "const p=require('child_process').execFileSync('tar',['-xOzf','release/folder-structure-sync-2.0.0.tgz','package/package.json']); const m=JSON.parse(p); if(m.name !== 'folder-structure-sync' || m.version !== '2.0.0') throw new Error('Unexpected packed npm identity')"
      - name: Publish immutable npm package with provenance
        run: npm publish release/folder-structure-sync-2.0.0.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
